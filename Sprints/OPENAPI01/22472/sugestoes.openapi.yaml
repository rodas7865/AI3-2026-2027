    #seguro: sim | indepotente: sim
    get:
      operationId: obterEstatisticasResolucao
      summary: Totais por estado, taxa e tempo médio de resolução
      responses:
        '200':
          description: not found
          content:
            application/json:
                schema:
                  type: object
        '404':
          description: not found
